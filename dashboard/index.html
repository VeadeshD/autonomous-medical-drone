<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Mission Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent-primary: #3b82f6;
            --accent-secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.15), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            margin-top: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .header p {
            color: var(--text-muted);
            margin-top: 5px;
            font-size: 1.1rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            margin-top: 40px;
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: skewX(-25deg);
            animation: shine 6s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-title {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: 300;
            margin: 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .card-unit {
            font-size: 1.2rem;
            color: var(--text-muted);
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 10px;
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }
        
        .status-indicator.warning {
            background-color: var(--warning);
            box-shadow: 0 0 10px var(--warning);
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .log-terminal {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            color: var(--accent-primary);
            font-size: 1rem;
            margin-top: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(to right, var(--success), var(--accent-primary));
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>MISSION CONTROL</h1>
        <p>Live Telemetry & AI Tracking</p>
    </div>

    <div class="dashboard-grid">
        
        <div class="glass-card full-width">
            <div class="card-title">Mission Phase</div>
            <h2 class="card-value" style="font-size: 2rem;">
                <span id="phase-status" class="status-indicator"></span>
                <span id="val-phase">Waiting for Telemetry...</span>
            </h2>
            <div class="log-terminal" id="val-status">No data</div>
        </div>

        <div class="glass-card">
            <div class="card-title">Altitude (AGL)</div>
            <div class="card-value">
                <span id="val-alt">0.0</span><span class="card-unit">m</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="bar-alt" style="width: 0%;"></div>
            </div>
        </div>

        <div class="glass-card">
            <div class="card-title">Flight Mode</div>
            <div class="card-value" style="color: var(--accent-secondary);" id="val-mode">
                UNKNOWN
            </div>
        </div>

        <div class="glass-card">
            <div class="card-title">Battery Level</div>
            <div class="card-value">
                <span id="val-battery">0</span><span class="card-unit">%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="bar-battery" style="background: var(--success); width: 0%;"></div>
            </div>
        </div>
        
        <div class="glass-card">
            <div class="card-title">AI Tracking (Distance)</div>
            <div class="card-value">
                <span id="val-distance">--</span><span class="card-unit">m</span>
            </div>
        </div>

    </div>

    <script>
        async function fetchTelemetry() {
            try {
                // Add a timestamp to prevent the browser from caching the JSON file!
                const cacheBuster = new Date().getTime();
                const response = await fetch('/telemetry.json?t=' + cacheBuster);
                if (!response.ok) return;
                
                const data = await response.json();

                // Update Altitude
                document.getElementById('val-alt').innerText = data.altitude.toFixed(1);
                // Assume max alt is ~30m for the progress bar
                let altPct = Math.min((data.altitude / 30) * 100, 100);
                document.getElementById('bar-alt').style.width = altPct + '%';

                // Update Battery
                document.getElementById('val-battery').innerText = data.battery;
                document.getElementById('bar-battery').style.width = data.battery + '%';
                if(data.battery < 30) {
                    document.getElementById('bar-battery').style.background = 'var(--warning)';
                }

                // Update Mode
                document.getElementById('val-mode').innerText = data.mode;

                // Update Phase and Status
                document.getElementById('val-phase').innerText = data.phase;
                document.getElementById('val-status').innerText = "> " + data.status;

                // Update Distance
                if(data.distance > 0) {
                    document.getElementById('val-distance').innerText = data.distance.toFixed(1);
                } else {
                    document.getElementById('val-distance').innerText = "--";
                }

                // Indicator logic
                const indicator = document.getElementById('phase-status');
                if(data.phase.includes("AI Velocity Control") || data.phase.includes("Obstacle")) {
                    indicator.className = "status-indicator warning";
                } else {
                    indicator.className = "status-indicator";
                }

            } catch (error) {
                console.log("Telemetry waiting...");
            }
        }

        // Poll every 250ms for buttery smooth updates
        setInterval(fetchTelemetry, 250);
    </script>
</body>
</html>
